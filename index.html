            { id: 121, en: "Raise it a little bit higher.", th: "ยกขึ้นสูงอีกนิดนึง", category: "ปัญหา/คำสั่ง" },
            { id: 122, en: "Lower it down slowly.", th: "เอาลงช้าๆ", category: "ปัญหา/คำสั่ง" },

            { id: 124, en: "Make sure everything is secure.", th: "ดูให้แน่ใจว่าทุกอย่างยึดแน่นหนาแล้ว", category: "ปัญหา/คำสั่ง" },

        const Icons = {
            HardHat: () => (

        function App() {
            const [activeTab, setActiveTab] = useState('learn');
            const [darkMode, setDarkMode] = useState(false);

            useEffect(() => {
                const body = document.getElementById('body-tag');
                if (darkMode) {
                    body.style.backgroundColor = '#0f172a';
                } else {
                    body.style.backgroundColor = '#f1f5f9';
                }
            }, [darkMode]);

            return (
                <div className={`min-h-screen flex flex-col smooth-transition ${darkMode ? 'bg-slate-950 text-slate-200' : 'bg-slate-100 text-slate-800'}`}>
                    <header className={`${darkMode ? 'bg-slate-900 border-b border-slate-800' : 'bg-blue-800'} text-white p-5 shadow-md sticky top-0 z-10 smooth-transition`}>
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <Icons.HardHat />
                                <div>
                                    <h1 className="text-3xl md:text-4xl font-bold heading-font tracking-wide">ConstrucTalk v1.3</h1>
                                    <p className="text-base text-blue-200">แอปพลิเคชันฝึกภาษาอังกฤษสำหรับงานก่อสร้าง</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className={`p-3 rounded-full transition-all ${darkMode ? 'bg-yellow-400 text-slate-900 hover:bg-yellow-300' : 'bg-blue-700 text-white hover:bg-blue-600'}`}
                                title={darkMode ? "สลับเป็นโหมดสว่าง" : "สลับเป็นโหมดมืด"}
                            >
                                {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                            </button>
                        </div>
                    </header>

                    <div className="max-w-4xl mx-auto flex w-full p-2 md:p-4 pb-0 gap-1 md:gap-2 mt-2">
                        <button 
                            onClick={() => setActiveTab('learn')}
                            className={`flex-1 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 py-4 rounded-t-2xl text-sm md:text-lg font-bold transition-all ${
                                activeTab === 'learn' 
                                ? (darkMode ? 'bg-slate-900 text-yellow-400 border-t-4 border-yellow-400' : 'bg-white text-blue-800 border-t-4 border-blue-800') 
                                : (darkMode ? 'bg-slate-800 text-slate-500' : 'bg-slate-200 text-slate-600')
                            }`}
                        >
                            <Icons.BookOpen /> คลังประโยค
                        </button>
                        <button 
                            onClick={() => setActiveTab('random')}
                            className={`flex-1 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 py-4 rounded-t-2xl text-sm md:text-lg font-bold transition-all ${
                                activeTab === 'random' 
                                ? (darkMode ? 'bg-slate-900 text-yellow-400 border-t-4 border-yellow-400' : 'bg-white text-blue-800 border-t-4 border-blue-800') 
                                : (darkMode ? 'bg-slate-800 text-slate-500' : 'bg-slate-200 text-slate-600')
                            }`}
                        >
                            <Icons.Shuffle /> สุ่มประโยค
                        </button>
                        <button 
                            onClick={() => setActiveTab('quiz')}
                            className={`flex-1 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 py-4 rounded-t-2xl text-sm md:text-lg font-bold transition-all ${
                                activeTab === 'quiz' 
                                ? (darkMode ? 'bg-slate-900 text-yellow-400 border-t-4 border-yellow-400' : 'bg-white text-blue-800 border-t-4 border-blue-800') 
                                : (darkMode ? 'bg-slate-800 text-slate-500' : 'bg-slate-200 text-slate-600')
                            }`}
                        >
                            <Icons.Brain /> แบบทดสอบ
                        </button>
                    </div>

                    <main className={`max-w-4xl mx-auto w-full flex-1 shadow-sm p-4 md:p-6 rounded-b-2xl mb-8 smooth-transition ${darkMode ? 'bg-slate-900' : 'bg-white'}`}>
                        {activeTab === 'learn' && <LearnTab darkMode={darkMode} />}
                        {activeTab === 'random' && <RandomTab darkMode={darkMode} />}
                        {activeTab === 'quiz' && <QuizTab darkMode={darkMode} />}
                    </main>
                </div>
            );
        }

        function RandomTab({ darkMode }) {
            const [phrase, setPhrase] = useState(null);

            const pickRandom = () => {
                const idx = Math.floor(Math.random() * PHRASES_DATA.length);
                setPhrase(PHRASES_DATA[idx]);
            };

            useEffect(() => {
                pickRandom();
            }, []);

            const playAudio = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                }
            };

            if (!phrase) return null;

            return (
                <div className="flex flex-col items-center justify-center py-12 px-2 text-center min-h-[50vh] animate-in fade-in">
                    <span className={`inline-block px-4 py-1.5 text-base md:text-lg font-bold rounded-lg mb-6 ${darkMode ? 'bg-slate-700 text-slate-300' : 'bg-slate-200 text-slate-700'}`}>
                        หมวดหมู่: {phrase.category}
                    </span>
                    <h2 className={`font-black text-4xl md:text-5xl mb-6 leading-tight ${darkMode ? 'text-slate-100' : 'text-slate-900'}`}>
                        {phrase.en}
                    </h2>
                    <p className={`text-2xl md:text-3xl font-medium mb-12 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                        {phrase.th}
                    </p>
                    
                    <div className="flex flex-col w-full max-w-sm gap-4">
                        <button 
                            onClick={() => playAudio(phrase.en)}
                            className={`flex items-center justify-center gap-2 py-4 rounded-xl text-xl font-bold transition-all ${darkMode ? 'bg-slate-700 text-yellow-400 hover:bg-slate-600' : 'bg-blue-100 text-blue-800 hover:bg-blue-200'}`}
                        >
                            <Icons.Volume2 /> ฟังเสียง
                        </button>
                        <button 
                            onClick={pickRandom}
                            className={`flex items-center justify-center gap-2 py-4 rounded-xl text-xl font-bold shadow-md transition-all ${darkMode ? 'bg-yellow-500 text-slate-950 hover:bg-yellow-400' : 'bg-blue-800 text-white hover:bg-blue-700'}`}
                        >
                            สุ่มประโยคถัดไป <Icons.Shuffle />
                        </button>
                    </div>
                </div>
            );
        }

        function LearnTab({ darkMode }) {
            const [search, setSearch] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('ทั้งหมด');

            const filteredPhrases = useMemo(() => {
                return PHRASES_DATA.filter(phrase => {
                    const matchesSearch = phrase.en.toLowerCase().includes(search.toLowerCase()) || phrase.th.includes(search);
                    const matchesCategory = selectedCategory === 'ทั้งหมด' || phrase.category === selectedCategory;
                    return matchesSearch && matchesCategory;
                });
            }, [search, selectedCategory]);

            const playAudio = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="space-y-4">
                        <div className="relative">
                            <div className="absolute left-4 top-1/2 transform -translate-y-1/2">
                                <Icons.Search />
                            </div>
                            <input 
                                type="text" 
                                placeholder="ค้นหาประโยค (ปูน, เข็ม, ตรวจ, น้ำรั่ว)..." 
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                className={`w-full pl-14 pr-4 py-5 border rounded-2xl outline-none text-xl md:text-2xl smooth-transition ${
                                    darkMode 
                                    ? 'bg-slate-800 border-slate-700 text-slate-200 focus:ring-2 focus:ring-yellow-500 placeholder-slate-500' 
                                    : 'bg-white border-slate-300 text-slate-800 focus:ring-2 focus:ring-blue-500'
                                }`}
                            />
                        </div>
                        
                        <div className="flex flex-wrap gap-2">
                            {CATEGORIES.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-5 py-3 rounded-xl text-base md:text-lg font-bold transition-all ${
                                        selectedCategory === cat 
                                          ? (darkMode ? 'bg-yellow-500 text-slate-900' : 'bg-blue-800 text-white') 
                                          : (darkMode ? 'bg-slate-800 text-slate-400 hover:bg-slate-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className={`text-lg font-bold ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>พบ {filteredPhrases.length} ประโยค</div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {filteredPhrases.length > 0 ? (
                            filteredPhrases.map(phrase => (
                                <div key={phrase.id} className={`border rounded-2xl p-6 transition-all flex flex-col justify-between ${
                                    darkMode 
                                    ? 'border-slate-800 bg-slate-800/40 hover:border-slate-600' 
                                    : 'border-slate-200 bg-slate-50/50 hover:border-blue-300 shadow-sm'
                                }`}>
                                    <div>
                                        <span className={`inline-block px-3 py-1 text-sm font-bold rounded-lg mb-3 ${
                                            darkMode ? 'bg-slate-700 text-slate-300' : 'bg-slate-200 text-slate-700'
                                        }`}>
                                            {phrase.category}
                                        </span>
                                        <p className={`font-black text-3xl md:text-4xl mb-3 leading-snug ${darkMode ? 'text-slate-100' : 'text-slate-900'}`}>{phrase.en}</p>
                                        <p className={`${darkMode ? 'text-slate-400' : 'text-slate-600'} text-xl md:text-2xl font-medium`}>{phrase.th}</p>
                                    </div>
                                    <button 
                                        onClick={() => playAudio(phrase.en)}
                                        className={`mt-6 self-end flex items-center gap-2 px-5 py-3 rounded-xl text-lg font-bold transition-all ${
                                            darkMode 
                                            ? 'text-yellow-400 bg-slate-700 hover:bg-slate-600' 
                                            : 'text-blue-800 bg-blue-50 hover:bg-blue-100'
                                        }`}
                                    >
                                        <Icons.Volume2 /> ฟังเสียง
                                    </button>
                                </div>
                            ))
                        ) : (
                            <div className="col-span-full text-center py-12 text-slate-500 font-bold text-xl italic">
                                ไม่พบข้อมูลประโยคที่คุณต้องการ...
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function QuizTab({ darkMode }) {
            const [gameState, setGameState] = useState('start');
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [questions, setQuestions] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);

            const startQuiz = () => {
                const shuffled = [...PHRASES_DATA].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 10).map(q => {
                    const otherOptions = shuffled.filter(opt => opt.id !== q.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                    const options = [q, ...otherOptions].sort(() => 0.5 - Math.random());
                    return { ...q, options };
                });
                setQuestions(selected);
                setCurrentQuestionIdx(0);
                setScore(0);
                setSelectedAnswer(null);
                setIsCorrect(null);
                setGameState('playing');
            };

            const handleAnswer = (option) => {
                if (selectedAnswer) return;
                const correct = option.id === questions[currentQuestionIdx].id;
                setSelectedAnswer(option);
                setIsCorrect(correct);
                if (correct) setScore(prev => prev + 1);
            };

            const nextQuestion = () => {
                if (currentQuestionIdx < questions.length - 1) {
                    setCurrentQuestionIdx(prev => prev + 1);
                    setSelectedAnswer(null);
                    setIsCorrect(null);
                } else {
                    setGameState('end');
                }
            };

            if (gameState === 'start') {
                return (
                    <div className="flex flex-col items-center justify-center py-20 text-center animate-in fade-in">
                        <div className={`w-24 h-24 rounded-full flex items-center justify-center mb-8 shadow-inner ${
                            darkMode ? 'bg-slate-800 text-yellow-400' : 'bg-blue-50 text-blue-800'
                        }`}>
                            <Icons.Brain />
                        </div>
                        <h2 className={`text-3xl md:text-4xl font-bold mb-4 heading-font ${darkMode ? 'text-slate-100' : 'text-slate-800'}`}>พร้อมทดสอบความแม่นยำหรือยัง?</h2>
                        <p className={`mb-10 max-w-lg text-lg md:text-xl px-4 leading-relaxed ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                            ระบบจะสุ่มประโยคภาษาไทยขึ้นมา 10 ข้อ ให้คุณเลือกประโยคภาษาอังกฤษที่ตรงที่สุด
                        </p>
                        <button 
                            onClick={startQuiz}
                            className={`font-black py-5 px-12 rounded-2xl shadow-md transition-all hover:scale-105 text-xl md:text-2xl ${
                                darkMode ? 'bg-yellow-500 text-slate-950' : 'bg-blue-800 text-white'
                            }`}
                        >
                            เริ่มทำแบบทดสอบ
                        </button>
                    </div>
                );
            }

            if (gameState === 'end') {
                return (
                    <div className="flex flex-col items-center justify-center py-20 text-center">
                        <div className="text-7xl mb-6">
                            {score >= 8 ? '🏅 เก่งมาก!' : score >= 5 ? '👍 ใช้ได้เลย' : '🏗️ ฝึกอีกนิดนะ'}
                        </div>
                        <h2 className={`text-4xl font-bold mb-3 heading-font ${darkMode ? 'text-slate-100' : 'text-slate-800'}`}>สรุปคะแนน</h2>
                        <p className={`mb-10 text-xl font-medium ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                            คุณได้คะแนน <span className={`font-black text-4xl ${darkMode ? 'text-yellow-400' : 'text-blue-800'}`}>{score}</span> เต็ม 10
                        </p>
                        <button 
                            onClick={startQuiz}
                            className={`flex items-center gap-3 font-bold py-4 px-10 rounded-2xl transition-all text-xl ${
                                darkMode ? 'bg-slate-700 text-white hover:bg-slate-600' : 'bg-slate-800 text-white hover:bg-slate-900'
                            }`}
                        >
                            <Icons.RefreshCw /> เล่นใหม่อีกรอบ
                        </button>
                    </div>
                );
            }

            const question = questions[currentQuestionIdx];

            return (
                <div className="max-w-2xl mx-auto py-4">
                    <div className="flex justify-between items-center mb-6 px-1">
                        <span className={`text-base font-bold uppercase tracking-wider ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                            คำถาม {currentQuestionIdx + 1} / 10
                        </span>
                        <span className={`font-bold px-5 py-2 rounded-full text-base ${darkMode ? 'bg-yellow-900 text-yellow-300' : 'bg-yellow-100 text-yellow-800'}`}>
                            คะแนน: {score}
                        </span>
                    </div>

                    <div className={`p-8 md:p-10 rounded-2xl mb-8 shadow-md text-center border ${
                        darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-800 border-slate-700 text-white'
                    }`}>
                        <span className="inline-block px-4 py-1.5 bg-slate-700 text-slate-300 text-sm font-bold rounded-lg mb-4">ความหมายภาษาไทย</span>
                        <h3 className="text-3xl md:text-4xl font-black leading-relaxed">{question.th}</h3>
                    </div>

                    <div className="space-y-4">
                        {question.options.map((opt, idx) => {
                            let btnClass = "w-full text-left p-6 rounded-2xl border-2 font-bold transition-all text-xl md:text-2xl flex justify-between items-center ";
                            if (!selectedAnswer) {
                                btnClass += darkMode 
                                    ? "border-slate-800 bg-slate-800 text-slate-300 hover:border-yellow-500 hover:bg-slate-750" 
                                    : "border-slate-200 bg-white text-slate-700 hover:border-blue-500 hover:bg-blue-50/50";
                            } else {
                                if (opt.id === question.id) {
                                    btnClass += "border-green-500 bg-green-50 text-green-900 font-black";
                                } else if (selectedAnswer.id === opt.id && !isCorrect) {
                                    btnClass += "border-red-500 bg-red-50 text-red-900 font-black";
                                } else {
                                    btnClass += darkMode ? "border-slate-900 bg-slate-900 text-slate-600 opacity-40" : "border-slate-100 bg-white text-slate-300 opacity-60";
                                }
                            }
                            return (
                                <button key={idx} onClick={() => handleAnswer(opt)} disabled={!!selectedAnswer} className={btnClass}>
                                    <span className="leading-snug">{opt.en}</span>
                                    {selectedAnswer && opt.id === question.id && <span className="text-green-600 text-xl font-black ml-3 shrink-0">✓ ถูก</span>}
                                    {selectedAnswer && selectedAnswer.id === opt.id && !isCorrect && <span className="text-red-600 text-xl font-black ml-3 shrink-0">✗ ผิด</span>}
                                </button>
                            );
                        })}
                    </div>

                    {selectedAnswer && (
                        <div className="mt-8 flex justify-end">
                            <button 
                                onClick={nextQuestion}
                                className={`flex items-center gap-2 font-bold py-4 px-8 rounded-2xl shadow-sm transition-all text-xl ${
                                    darkMode ? 'bg-yellow-500 text-slate-950' : 'bg-blue-800 text-white'
                                }`}
                            >
                                {currentQuestionIdx < questions.length - 1 ? 'ข้อต่อไป' : 'ดูคะแนนสรุป'} <Icons.ChevronRight />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
